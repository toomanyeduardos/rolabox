name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch or PR cancels the run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # Matches gradle/gradle-daemon-jvm.properties, so Gradle doesn't download its own JDK.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6
        with:
          # Only builds on main write the cache; PRs read it.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # TODO(M6): switch the debug tasks below to the offline flavor
      # (assembleOfflineDebug, testOfflineDebugUnitTest, lintOfflineDebug)
      # so CI never needs Firebase config.

      - name: ktlint
        run: ./gradlew ktlintCheck

      # detektMain/detektTest run the type-resolved rules the plain task skips.
      - name: detekt
        run: ./gradlew detekt detektMain detektTest

      - name: Assemble debug
        run: ./gradlew assembleDebug

      # Pure Kotlin modules have no variants, so they run `test` instead.
      # Add new rolabox.jvm.library modules here.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest :core:model:test :core:common:test

      - name: Android lint
        run: ./gradlew lintDebug

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
