name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch or PR cancels the run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # Matches gradle/gradle-daemon-jvm.properties, so Gradle doesn't download its own JDK.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6
        with:
          # Only builds on main write the cache; PRs read it.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # The default flavor, built exactly as a fresh clone would be: there is no google-services.json
      # here, so :app has no cloud variants (ADR-008). The cloud job below covers the other flavor.

      - name: ktlint
        run: ./gradlew ktlintCheck

      # detektMain/detektTest run the type-resolved rules the plain task skips.
      - name: detekt
        run: ./gradlew detekt detektMain detektTest

      - name: Assemble offline debug
        run: ./gradlew assembleOfflineDebug

      # ADR-008 rule 3: nothing from Firebase or Play services reaches the offline app.
      - name: Offline app has no Firebase
        run: |
          if ./gradlew -q :app:dependencies --configuration offlineReleaseRuntimeClasspath \
              | grep -E "com\.google\.(firebase|android\.gms)"; then
            echo "::error::Firebase or Play services found on the offline runtime classpath"
            exit 1
          fi

      # Pure Kotlin modules have no variants, so they run `test` instead.
      # Add new rolabox.jvm.library modules here.
      - name: Unit tests
        run: ./gradlew testOfflineDebugUnitTest :core:model:test :core:common:test :core:domain:test

      - name: Android lint
        run: ./gradlew lintOfflineDebug

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # The cloud flavor, against a placeholder Firebase config written below. It checks that the cloud
  # app compiles, that its Hilt graph is complete, and that its tests and lint pass. Nothing talks to
  # Firebase, so no secrets are needed and PRs from forks run it too. ktlint and library detekt
  # already cover cloud source sets in the build job.
  cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Placeholder, never committed (ADR-008 rule 7). Only the package name has to match.
      - name: Write placeholder google-services.json
        run: |
          cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "rolabox-ci",
              "storage_bucket": "rolabox-ci.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": { "package_name": "com.eduardoflores.rolabox" }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "placeholder" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      # :app's cloud source set only has variants when google-services.json exists.
      - name: detekt (app)
        run: ./gradlew :app:detektMain :app:detektTest

      - name: Assemble cloud debug
        run: ./gradlew assembleCloudDebug

      - name: Unit tests
        run: ./gradlew testCloudDebugUnitTest

      - name: Android lint
        run: ./gradlew lintCloudDebug

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: reports-cloud
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
