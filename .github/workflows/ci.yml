name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch or PR cancels the run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # Matches gradle/gradle-daemon-jvm.properties, so Gradle doesn't download its own JDK.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6
        with:
          # Only builds on main write the cache; PRs read it.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Built exactly as a fresh clone would be: there is no google-services.json here, so the app
      # uses the committed placeholder (ADR-008). Nothing talks to Firebase, so no secrets are needed
      # and PRs from forks run everything.

      # ADR-008 rule 5: a real Firebase config is never committed, even with `git add -f`.
      - name: No Firebase config committed
        run: |
          if git ls-files | grep -E '(^|/)google-services\.json$'; then
            echo "::error::google-services.json is tracked. Remove it with git rm --cached; it's git-ignored."
            exit 1
          fi

      - name: ktlint
        run: ./gradlew ktlintCheck

      # detektMain/detektTest run the type-resolved rules the plain task skips.
      - name: detekt
        run: ./gradlew detekt detektMain detektTest

      - name: Assemble debug
        run: ./gradlew assembleDebug

      # Every module's unitTest task: debug tests for Android modules, `test` for JVM ones.
      - name: Unit tests
        run: ./gradlew unitTest

      - name: Android lint
        run: ./gradlew lintDebug

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # Firestore security rules against the emulator (ADR-010). The demo- project ID needs no Firebase
  # project or credentials, so PRs from forks run it too.
  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: firebase

    steps:
      - uses: actions/checkout@v7

      # The emulator needs a JDK 21+.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Rules tests
        run: npm test
