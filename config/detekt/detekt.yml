# Overrides on top of detekt's default config (buildUponDefaultConfig = true).
# Only list what differs from the defaults: https://detekt.dev/docs/rules/

naming:
  FunctionNaming:
    # @Composable functions are PascalCase by convention.
    ignoreAnnotated: ['Composable']
    # Test names use underscores. detekt's defaults exclude src/test but not the per-flavor test
    # source sets (ADR-008).
    excludes: ['**/test/**', '**/testOffline/**', '**/testCloud/**', '**/androidTest/**']

complexity:
  LongParameterList:
    # Composables take many optional parameters by design.
    ignoreDefaultParameters: true
    ignoreAnnotated: ['Composable']

coroutines:
  GlobalCoroutineUsage:
    # ADR-006 rule 7: work that must outlive a screen uses the injected @ApplicationScope.
    active: true
  InjectDispatcher:
    # Hilt @Provides functions are where dispatchers get injected from.
    ignoreAnnotated: ['Provides']
  SuspendFunSwallowedCancellation:
    # ADR-007 rule 5: CancellationException is never swallowed.
    active: true

style:
  AbstractClassCanBeInterface:
    # Dagger/Hilt modules with @Binds are abstract classes by convention.
    ignoreAnnotated: ['Module']
  MagicNumber:
    # Color literals and dimensions in the design system are the definitions themselves.
    ignorePropertyDeclaration: true
    excludes: ['**/test/**', '**/testOffline/**', '**/testCloud/**', '**/androidTest/**', '**/designsystem/**/theme/**']
  UnusedPrivateFunction:
    # @Preview functions (and multipreview annotations, named Preview* per compose-rules) are only called by tooling.
    ignoreAnnotated: ['Preview', 'Preview*']
  UnusedImport:
    active: true
