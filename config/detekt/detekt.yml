# Overrides on top of detekt's default config (buildUponDefaultConfig = true).
# Only list what differs from the defaults: https://detekt.dev/docs/rules/

naming:
  FunctionNaming:
    # @Composable functions are PascalCase by convention.
    ignoreAnnotated: ['Composable']
    # Test names use underscores. detekt's defaults exclude src/test but not the per-flavor test
    # source sets (ADR-008).
    excludes: ['**/test/**', '**/testOffline/**', '**/testCloud/**', '**/androidTest/**']

complexity:
  LongParameterList:
    # Composables take many optional parameters by design.
    ignoreDefaultParameters: true
    ignoreAnnotated: ['Composable']

coroutines:
  GlobalCoroutineUsage:
    # ADR-006 rule 7: work that must outlive a screen uses the injected @ApplicationScope.
    active: true
  InjectDispatcher:
    # Hilt @Provides functions are where dispatchers get injected from.
    ignoreAnnotated: ['Provides']
  SuspendFunSwallowedCancellation:
    # ADR-007 rule 5: CancellationException is never swallowed.
    active: true

style:
  AbstractClassCanBeInterface:
    # Dagger/Hilt modules with @Binds are abstract classes by convention.
    ignoreAnnotated: ['Module']
  ForbiddenImport:
    # ADR-015 rule 3: text sizes and weights come from the design system's text styles.
    active: true
    excludes: ['**/common/designsystem/**']
    forbiddenImports:
      - value: 'androidx.compose.ui.unit.sp'
        reason: 'ADR-015 rule 3: text sizes are defined only in :common:designsystem. Use a RolaboxType.styles role.'
      - value: 'androidx.compose.ui.unit.em'
        reason: 'ADR-015 rule 3: letter spacing is defined only in :common:designsystem. Use a RolaboxType.styles role.'
      - value: 'androidx.compose.ui.text.font.FontWeight'
        reason: 'ADR-015 rule 3: font weights are defined only in :common:designsystem. Use a RolaboxType.styles role.'
  ForbiddenMethodCall:
    # ADR-015 rules 2 and 3: colors, fonts, text styles and shapes are defined only in the design system.
    # ADR-017 rule 2: no Density is built to override the font scale.
    active: true
    excludes: ['**/common/designsystem/**']
    methods:
      - value: 'androidx.compose.ui.graphics.Color'
        reason: 'ADR-015 rule 2: colors are defined only in :common:designsystem. Read a role from the theme.'
      - value: 'androidx.compose.ui.text.font.FontFamily'
        reason: 'ADR-015 rule 2: fonts are defined only in :common:designsystem.'
      - value: 'androidx.compose.ui.text.font.Font'
        reason: 'ADR-015 rule 2: fonts are defined only in :common:designsystem.'
      - value: 'androidx.compose.ui.text.TextStyle.<init>'
        reason: 'ADR-015 rule 3: text styles are defined only in :common:designsystem. Use a RolaboxType.styles role.'
      - value: 'androidx.compose.foundation.shape.RoundedCornerShape'
        reason: 'ADR-015 rule 3: shapes are defined only in :common:designsystem. Use MaterialTheme.shapes.'
      - value: 'androidx.compose.foundation.shape.CutCornerShape'
        reason: 'ADR-015 rule 3: shapes are defined only in :common:designsystem. Use MaterialTheme.shapes.'
      - value: 'androidx.compose.ui.unit.Density'
        reason: 'ADR-017 rule 2: text follows the system font scale. Do not build a Density to override or cap it.'
  MagicNumber:
    # Color literals and dimensions in the design system are the definitions themselves.
    ignorePropertyDeclaration: true
    excludes: ['**/test/**', '**/testOffline/**', '**/testCloud/**', '**/androidTest/**', '**/designsystem/**/theme/**']
  UnusedPrivateFunction:
    # @Preview functions (and multipreview annotations, named Preview* per compose-rules) are only called by tooling.
    ignoreAnnotated: ['Preview', 'Preview*']
  UnusedImport:
    active: true

# Rolabox's own rules (build-logic/detekt-rules).
rolabox:
  UseCaseOrRepositoryClassInApi:
    # ADR-021 rule 1: in an :api, a use case or a repository is an interface. The rule runs on :api
    # modules only, which this is what says so.
    active: true
    includes: ['**/api/src/**']
  ViewModelImplInComposable:
    # ADR-021 rule 2: composables take the abstract ViewModel. Only an entry names a …ViewModelImpl.
    active: true
  TouchInputInDeviceScreen:
    # ADR-018 rule 3: a device screen is operated by the wheel only. A file is a device screen when it
    # imports the device host or a device component, so a full screen such as Settings is not checked.
    # The host and the design system implement the wheel's input, and are left out.
    active: true
    excludes: ['**/device/host/**', '**/common/designsystem/**']
  DeviceComponentOutsideDesignSystem:
    # ADR-018 rule 12: the device's parts and the wheel's events are declared in the design system only.
    # A new device component or event type is added to `names` (the rule's own default is the same list).
    active: true
    excludes: ['**/common/designsystem/**']
    names:
      - 'WheelEvent'
      - 'HoldState'
      - 'Wheel'
      - 'DeviceBody'
      - 'DeviceDisplay'
      - 'DeviceHeader'
      - 'DeviceList'
      - 'DeviceListRow'
      - 'DeviceMessage'
  FixedHeightAroundText:
    # ADR-017 rule 3: a container of text grows with it.
    active: true
    # Compose's text composables, then the components of the design system, the sign-in step of
    # :auth:ui:impl and the device host that show text. A new one is added here (ADR-017 rule 9).
    textComposables:
      - 'Text'
      - 'BasicText'
      - 'TextField'
      - 'OutlinedTextField'
      - 'BasicTextField'
      - 'PrimaryButton'
      - 'SecondaryButton'
      - 'RowKey'
      - 'ChoiceKey'
      - 'ChoiceGroup'
      - 'LcdStatusBar'
      - 'Wordmark'
      - 'WordmarkHeader'
      - 'RecessedField'
      - 'ReadOnlyField'
      - 'FieldError'
      - 'StrengthMeter'
      - 'OrDivider'
      - 'FooterLink'
      - 'UnderlinedLink'
      - 'TextAction'
      - 'RolaboxTopBar'
      - 'Wheel'
      - 'DeviceBody'
      - 'DeviceDisplay'
      - 'DeviceHeader'
      - 'DeviceMessage'
      - 'DeviceScreen'
      - 'DeviceHost'
      - 'GoogleButton'
      - 'SignInButton'
